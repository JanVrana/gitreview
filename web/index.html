<!doctype html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitreview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='6' height='12' rx='1' fill='%23629755'/%3E%3Crect x='9' y='2' width='6' height='12' rx='1' fill='%234a88c7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="vendor/highlight.min.js"></script>
</head>
<body>
<header id="toolbar">
  <div class="repo"><span id="repo-name">…</span><span id="branch" class="branch"></span></div>
  <label>Proti <select id="opt-base"></select></label>
  <label title="Levá strana: společný předek větví (jako Pull Request), nebo aktuální špička base větve">Vlevo
    <select id="opt-left">
      <option value="mergebase">merge-base (jako PR)</option>
      <option value="tip">špička base větve</option>
    </select>
  </label>
  <label title="Pravá strana: pracovní kopie včetně necommitnutých a nových souborů, nebo jen commity">Vpravo
    <select id="opt-right">
      <option value="worktree">pracovní kopie</option>
      <option value="head">HEAD (jen commity)</option>
    </select>
  </label>
  <label class="chk"><input type="checkbox" id="opt-ws"> Ignorovat mezery</label>
  <span class="spacer"></span>
  <button id="btn-comments" title="Seznam komentářů">Komentáře <span id="comment-count" class="badge">0</span></button>
  <button id="btn-export" title="Zapsat komentáře do REVIEW.md v kořeni repozitáře">Export REVIEW.md</button>
  <button id="btn-copy" title="Zkopírovat komentáře jako prompt pro Claude">Kopírovat</button>
  <button id="btn-theme" title="Přepnout světlé/tmavé téma">Téma</button>
  <span id="live" title="Auto-refresh"></span>
</header>
<div id="main">
  <aside id="sidebar">
    <div id="summary"></div>
    <div id="tree"></div>
  </aside>
  <div id="resizer"></div>
  <section id="content">
    <div id="diff-header"></div>
    <div id="diff-wrap">
      <div id="diff-scroll"><div class="msg">Načítám…</div></div>
      <div id="ruler"></div>
    </div>
    <div id="hscroll" class="cols">
      <div class="pad-num"></div>
      <div class="hs" id="hs-left"><div></div></div>
      <div class="pad-mid"></div>
      <div class="hs" id="hs-right"><div></div></div>
    </div>
  </section>
</div>
<div id="comments-panel" hidden></div>
<div id="toast" hidden></div>
<span id="measure" class="mono" aria-hidden="true">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</span>
<script src="app.js"></script>
</body>
</html>
