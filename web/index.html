<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitreview</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='2' width='6' height='12' rx='1' fill='%23629755'/%3E%3Crect x='9' y='2' width='6' height='12' rx='1' fill='%234a88c7'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="vendor/highlight.min.js"></script>
</head>
<body>
<header id="toolbar">
  <div class="repo"><span id="repo-name">…</span><span id="branch" class="branch"></span></div>
  <label><span data-i18n="against">Against</span> <select id="opt-base"></select></label>
  <span id="base-behind" class="behind" hidden></span>
  <button id="btn-fetch" data-i18n-title="fetchTitle" data-i18n="fetch">Fetch</button>
  <label data-i18n-title="leftTitle"><span data-i18n="left">Left</span>
    <select id="opt-left">
      <option value="mergebase" data-i18n="optMergebase">merge-base (like PR)</option>
      <option value="tip" data-i18n="optTip">tip of base branch</option>
    </select>
  </label>
  <label data-i18n-title="rightTitle"><span data-i18n="right">Right</span>
    <select id="opt-right">
      <option value="worktree" data-i18n="optWorktree">working tree</option>
      <option value="head" data-i18n="optHead">HEAD (commits only)</option>
    </select>
  </label>
  <label class="chk"><input type="checkbox" id="opt-ws"> <span data-i18n="ignoreWs">Ignore whitespace</span></label>
  <span class="spacer"></span>
  <button id="btn-comments" data-i18n-title="commentsTitle"><span data-i18n="comments">Comments</span> <span id="comment-count" class="badge">0</span></button>
  <button id="btn-export" data-i18n-title="exportTitle">Export REVIEW.md</button>
  <button id="btn-copy" data-i18n-title="copyTitle" data-i18n="copy">Copy</button>
  <div class="settings">
    <button id="btn-settings" data-i18n-title="settings" aria-haspopup="true" aria-expanded="false">⚙</button>
    <div id="settings-menu" hidden>
      <label><span data-i18n="theme">Theme</span>
        <select id="set-theme">
          <option value="dark" data-i18n="themeDark">Dark</option>
          <option value="light" data-i18n="themeLight">Light</option>
        </select>
      </label>
      <label><span data-i18n="language">Language</span>
        <select id="set-lang">
          <option value="en">English</option>
          <option value="cs">Čeština</option>
        </select>
      </label>
    </div>
  </div>
  <span id="live"></span>
</header>
<div id="main">
  <aside id="sidebar">
    <div id="summary"></div>
    <div id="tree"></div>
  </aside>
  <div id="resizer"></div>
  <section id="content">
    <div id="diff-header"></div>
    <div id="diff-wrap">
      <div id="diff-scroll"><div class="msg" data-i18n="loading">Loading…</div></div>
      <div id="ruler"></div>
    </div>
    <div id="hscroll" class="cols">
      <div class="pad-num"></div>
      <div class="hs" id="hs-left"><div></div></div>
      <div class="pad-mid"></div>
      <div class="hs" id="hs-right"><div></div></div>
    </div>
  </section>
</div>
<div id="comments-panel" hidden></div>
<div id="toast" hidden></div>
<span id="measure" class="mono" aria-hidden="true">xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</span>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
